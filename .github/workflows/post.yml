name: Post game news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      video_now:
        description: "Сделать ролик прямо сейчас"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gamenews
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Make video
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_FORCE: ${{ inputs.video_now }}
        run: python video.py

      - name: Save state
        if: always()
        run: |
          git config user.name "gamenews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if [ -f video_state.json ]; then git add video_state.json; fi
          git diff --staged --quiet || (git commit -m "update state" && git push)
